<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3M Hub - Family Portal</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: { 300: '#FDE047', 400: '#FACC15', 500: '#D4AF37', 600: '#CA8A04', 700: '#A16207' },
                        black: '#0A0A0A',
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .msg-bubble-sent { background: #dcf8c6; border-radius: 12px 0 12px 12px; }
        .msg-bubble-received { background: #202c33; color: white; border-radius: 0 12px 12px 12px; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 10px; }
    </style>
</head>
<body class="bg-black text-white font-sans overflow-hidden h-screen flex flex-col">

    <!-- Top Navigation -->
    <nav class="border-b border-gray-800 bg-[#111b21] px-4 py-3 flex items-center justify-between shrink-0">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-gold-500 rounded-full flex items-center justify-center font-bold text-black text-xl shadow-lg shadow-gold-500/20">3M</div>
            <div>
                <h1 class="text-lg font-bold tracking-tight text-white">Family Hub</h1>
                <p id="user-status-label" class="text-[10px] text-gold-500 uppercase tracking-widest font-bold">Connecting Generations</p>
            </div>
        </div>
        <div class="flex items-center space-x-4">
            <button onclick="toggleAdminView()" id="admin-toggle" class="hidden bg-gray-800 hover:bg-gray-700 p-2 rounded-full transition-all">
                <i class="fa-solid fa-shield-halved text-gold-500"></i>
            </button>
            <div id="user-initials" class="w-9 h-9 bg-gray-700 rounded-full flex items-center justify-center text-sm font-bold border border-gray-600">??</div>
        </div>
    </nav>

    <div class="flex-1 flex overflow-hidden relative">
        <!-- Sidebar -->
        <aside id="sidebar" class="w-full md:w-80 bg-[#111b21] border-r border-gray-800 flex flex-col transition-all duration-300 absolute md:relative z-20 h-full">
            <div class="p-4 space-y-4">
                <div class="bg-[#202c33] rounded-lg p-1 flex">
                    <button onclick="switchSidebarTab('chats')" id="tab-chats" class="flex-1 py-2 text-xs font-bold rounded-md bg-gold-500 text-black">CHATS</button>
                    <button onclick="switchSidebarTab('tree')" id="tab-tree" class="flex-1 py-2 text-xs font-bold rounded-md text-gray-400">FAMILY TREE</button>
                </div>
            </div>

            <!-- Chat List Scroll Area -->
            <div id="sidebar-content" class="flex-1 overflow-y-auto px-2 pb-20">
                <div id="group-chats-section">
                    <p class="text-[10px] font-bold text-gray-500 px-3 mb-2 mt-4 uppercase tracking-widest">Global Groups</p>
                    <div onclick="openChat('group1', 'Main Family')" class="flex items-center p-3 hover:bg-[#202c33] rounded-xl cursor-pointer transition-all group mb-1">
                        <div class="w-12 h-12 bg-gold-600 rounded-full flex items-center justify-center text-xl mr-3 shadow-md">🏠</div>
                        <div class="flex-1 border-b border-gray-800/50 pb-2 group-last:border-0">
                            <div class="flex justify-between items-center"><h3 class="font-bold text-sm">Main Family</h3><span class="text-[10px] text-gray-500">Global</span></div>
                            <p class="text-xs text-gray-400 truncate">Family announcements & news</p>
                        </div>
                    </div>
                </div>

                <div id="private-chats-section">
                    <p class="text-[10px] font-bold text-gold-500 px-3 mb-2 mt-6 uppercase tracking-widest flex justify-between items-center">
                        PRIVATE CHATS & ONLINE
                        <span id="online-count" class="bg-gold-500/10 text-gold-500 px-1.5 rounded text-[8px]">0</span>
                    </p>
                    <div id="user-list-container" class="space-y-1">
                        <!-- Users will be injected here in real-time -->
                        <div class="text-center py-10 opacity-30 italic text-xs">Waiting for family members...</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Chat View Area -->
        <main class="flex-1 flex flex-col bg-[#0b141a] relative">
            <!-- Chat Header -->
            <header class="h-16 bg-[#202c33] px-4 flex items-center justify-between border-b border-gray-800/30 z-10">
                <div class="flex items-center space-x-3">
                    <button onclick="toggleSidebar()" class="md:hidden text-gray-400 mr-2"><i class="fa-solid fa-arrow-left"></i></button>
                    <div id="chat-header-avatar" class="w-10 h-10 bg-gray-600 rounded-full flex items-center justify-center font-bold text-sm">CH</div>
                    <div>
                        <h2 id="current-chat-title" class="font-bold text-sm">Select a Chat</h2>
                        <p id="chat-subtitle" class="text-[10px] text-gray-400">End-to-end encrypted</p>
                    </div>
                </div>
                <div class="flex items-center space-x-4 text-gray-400">
                    <i class="fa-solid fa-video cursor-pointer hover:text-white transition-colors"></i>
                    <i class="fa-solid fa-phone cursor-pointer hover:text-white transition-colors"></i>
                    <i class="fa-solid fa-ellipsis-vertical cursor-pointer hover:text-white transition-colors"></i>
                </div>
            </header>

            <!-- Messages Container -->
            <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3 flex flex-col">
                <div class="flex-1 flex items-center justify-center opacity-20 flex-col">
                    <div class="w-24 h-24 bg-gold-500/10 rounded-full flex items-center justify-center mb-4">
                        <i class="fa-solid fa-comments text-4xl text-gold-500"></i>
                    </div>
                    <p class="text-sm italic">Start a secure conversation</p>
                </div>
            </div>

            <!-- Message Input -->
            <div id="input-area" class="bg-[#202c33] p-3 flex items-center space-x-2">
                <button class="text-gray-400 hover:text-white p-2"><i class="fa-solid fa-plus"></i></button>
                <div class="flex-1 bg-[#2a3942] rounded-lg flex items-center px-3">
                    <button class="text-gray-400 mr-2"><i class="fa-regular fa-face-smile"></i></button>
                    <input id="msg-input" type="text" placeholder="Type a message" class="bg-transparent border-none focus:ring-0 text-sm py-2.5 w-full text-white outline-none">
                </div>
                <div id="mic-container" class="relative">
                    <button id="btn-mic" onclick="startRecording()" class="text-gray-400 hover:text-gold-500 p-2"><i class="fa-solid fa-microphone"></i></button>
                    <button id="btn-send" onclick="sendMessage()" class="hidden text-gold-500 hover:text-gold-400 p-2"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>

            <!-- Recording Overlay -->
            <div id="recording-ui" class="hidden absolute bottom-0 left-0 right-0 bg-[#202c33] p-4 items-center justify-between z-30 animate-slide-up">
                <div class="flex items-center space-x-4">
                    <div class="flex items-center text-red-500 animate-pulse">
                        <i class="fa-solid fa-circle text-[8px] mr-2"></i>
                        <span id="record-timer" class="text-sm font-mono font-bold">00:00</span>
                    </div>
                    <div class="text-xs text-gray-400 italic">Recording encrypted voice note...</div>
                </div>
                <div class="flex items-center space-x-4">
                    <button onclick="cancelRecording()" class="text-gray-400 hover:text-white text-xs font-bold uppercase tracking-widest">Cancel</button>
                    <button onclick="stopRecording()" class="w-10 h-10 bg-gold-500 text-black rounded-full shadow-lg flex items-center justify-center hover:scale-110 transition-transform">
                        <i class="fa-solid fa-check"></i>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script>
        // --- CONFIGURATION & FIREBASE ---
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const appId = typeof __app_id !== 'undefined' ? __app_id : '3m-family-hub';

        // --- APP STATE ---
        const AppState = {
            userId: '',
            userName: '',
            isAdmin: false,
            activeGroup: 'group1',
            isRecording: false,
            recordSeconds: 0,
            allUsers: []
        };

        const el = {
            chatMessages: document.getElementById('chat-messages'),
            msgInput: document.getElementById('msg-input'),
            btnMic: document.getElementById('btn-mic'),
            btnSend: document.getElementById('btn-send'),
            recordingUI: document.getElementById('recording-ui'),
            recordTimer: document.getElementById('record-timer'),
            userList: document.getElementById('user-list-container'),
            onlineCount: document.getElementById('online-count')
        };

        // --- CRYPTO LOGIC ---
        const ChatCrypto = {
            keys: { 'group1': 'family_master_key', 'default': '3m_private_key' },
            getKey: (chatId) => ChatCrypto.keys[chatId] || (ChatCrypto.keys['default'] + '_' + chatId),
            encrypt: (data, chatId) => CryptoJS.AES.encrypt(data, ChatCrypto.getKey(chatId)).toString(),
            decrypt: (cipherText, chatId) => {
                try {
                    const bytes = CryptoJS.AES.decrypt(cipherText, ChatCrypto.getKey(chatId));
                    return bytes.toString(CryptoJS.enc.Utf8);
                } catch(e) { return "🔒 [Decrypted Failed]"; }
            }
        };

        // --- AUTH & PRESENCE ---
        async function initAuth() {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await auth.signInWithCustomToken(__initial_auth_token);
            } else {
                await auth.signInAnonymously();
            }
            
            auth.onAuthStateChanged(async (user) => {
                if (user) {
                    AppState.userId = user.uid;
                    
                    // Check if Admin
                    const email = user.email || "";
                    if (email === "3mhubs.admin@gmail.com") {
                        AppState.isAdmin = true;
                        document.getElementById('admin-toggle').classList.remove('hidden');
                        document.getElementById('user-status-label').innerText = "ADMINISTRATOR MODE";
                    }

                    // Prompt for name if not set
                    let storedName = localStorage.getItem('3m_user_name');
                    if (!storedName) {
                        storedName = prompt("Welcome to 3M Hub! Please enter your name:") || "Family Member";
                        localStorage.setItem('3m_user_name', storedName);
                    }
                    AppState.userName = storedName;
                    document.getElementById('user-initials').innerText = storedName.substring(0, 2).toUpperCase();

                    // Update presence in Firestore
                    const userDoc = db.doc(`artifacts/${appId}/public/data/presence/${user.uid}`);
                    await userDoc.set({
                        uid: user.uid,
                        name: AppState.userName,
                        lastSeen: firebase.firestore.FieldValue.serverTimestamp(),
                        status: 'online'
                    }, { merge: true });

                    listenToUsers();
                }
            });
        }

        // --- USER DISCOVERY & NOTIFICATIONS ---
        function listenToUsers() {
            db.collection(`artifacts/${appId}/public/data/presence`).onSnapshot((snapshot) => {
                const users = [];
                snapshot.forEach(doc => users.push(doc.data()));
                
                // Sort by last seen
                users.sort((a, b) => (b.lastSeen?.seconds || 0) - (a.lastSeen?.seconds || 0));
                
                AppState.allUsers = users;
                renderUserList(users);
                
                // Admin notification logic
                if (AppState.isAdmin) {
                    snapshot.docChanges().forEach(change => {
                        if (change.type === "added" && change.doc.id !== AppState.userId) {
                            showNotification("New Family Member Joined", `${change.doc.data().name} has just logged into the Hub!`);
                        }
                    });
                }
            }, (error) => console.error("Presence Listen Error", error));
        }

        function renderUserList(users) {
            el.userList.innerHTML = '';
            const otherUsers = users.filter(u => u.uid !== AppState.userId);
            el.onlineCount.innerText = otherUsers.length;

            if (otherUsers.length === 0) {
                el.userList.innerHTML = '<div class="text-center py-6 opacity-30 italic text-[10px]">No other members online</div>';
                return;
            }

            otherUsers.forEach(user => {
                const isOnline = true; // Simplified for this logic
                const userHtml = `
                    <div onclick="openChat('${user.uid}', '${user.name}')" class="flex items-center p-3 hover:bg-[#202c33] rounded-xl cursor-pointer transition-all group">
                        <div class="relative mr-3">
                            <div class="w-10 h-10 bg-gray-700 rounded-full flex items-center justify-center text-xs font-bold border border-gray-600">
                                ${user.name.substring(0,2).toUpperCase()}
                            </div>
                            <div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-[#111b21] rounded-full"></div>
                        </div>
                        <div class="flex-1 border-b border-gray-800/50 pb-2 group-last:border-0">
                            <div class="flex justify-between items-center"><h3 class="font-bold text-xs text-gray-200">${user.name}</h3></div>
                            <p class="text-[10px] text-gray-500 truncate">Family Member • Online</p>
                        </div>
                    </div>
                `;
                el.userList.insertAdjacentHTML('beforeend', userHtml);
            });
        }

        // --- CHAT LOGIC ---
        function openChat(id, title) {
            AppState.activeGroup = id;
            document.getElementById('current-chat-title').innerText = title;
            document.getElementById('chat-header-avatar').innerText = title.substring(0, 2).toUpperCase();
            loadMessages();
            if (window.innerWidth < 768) toggleSidebar();
        }

        function sendMessage() {
            const val = el.msgInput.value.trim();
            if (!val) return;

            const msg = {
                id: Date.now().toString(),
                type: 'text',
                sender: AppState.userName,
                senderId: AppState.userId,
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                encryptedData: ChatCrypto.encrypt(val, AppState.activeGroup)
            };

            saveToLocal(AppState.activeGroup, msg);
            displayMessage(msg);
            el.msgInput.value = '';
            el.btnSend.classList.add('hidden');
            el.btnMic.classList.remove('hidden');
        }

        function displayMessage(msg) {
            const isMe = msg.senderId === AppState.userId;
            const bubble = isMe ? 'msg-bubble-sent' : 'msg-bubble-received';
            const align = isMe ? 'justify-end' : 'justify-start';
            const text = ChatCrypto.decrypt(msg.encryptedData, AppState.activeGroup);

            const html = `
                <div class="flex ${align} fade-in">
                    <div class="${bubble} px-3 py-2 max-w-[80%] shadow-sm relative">
                        ${!isMe ? `<p class="text-[10px] font-bold text-gold-500 mb-0.5">${msg.sender}</p>` : ''}
                        <p class="text-sm ${isMe ? 'text-black' : 'text-white'}">${text}</p>
                        <div class="flex justify-end items-center mt-1 space-x-1">
                            <span class="text-[9px] ${isMe ? 'text-black/60' : 'text-gray-400'}">${msg.timestamp}</span>
                            ${isMe ? '<i class="fa-solid fa-check-double text-[10px] text-blue-500"></i>' : ''}
                        </div>
                    </div>
                </div>
            `;
            el.chatMessages.insertAdjacentHTML('beforeend', html);
            el.chatMessages.scrollTop = el.chatMessages.scrollHeight;
        }

        // --- AUDIO ---
        let mediaRecorder;
        let audioChunks = [];
        let timerInterval;

        async function startRecording() {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            AppState.recordSeconds = 0;
            
            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.onstop = async () => {
                const blob = new Blob(audioChunks, { type: 'audio/webm' });
                const base64 = await blobToBase64(blob);
                const msg = {
                    id: 'audio-' + Date.now(),
                    type: 'audio',
                    sender: AppState.userName,
                    senderId: AppState.userId,
                    timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    encryptedData: ChatCrypto.encrypt(base64, AppState.activeGroup)
                };
                saveToLocal(AppState.activeGroup, msg);
                displayMessage(msg); // Simplified display
            };

            mediaRecorder.start();
            el.recordingUI.classList.remove('hidden');
            el.recordingUI.classList.add('flex');
            timerInterval = setInterval(() => {
                AppState.recordSeconds++;
                const m = Math.floor(AppState.recordSeconds / 60).toString().padStart(2, '0');
                const s = (AppState.recordSeconds % 60).toString().padStart(2, '0');
                el.recordTimer.innerText = `${m}:${s}`;
            }, 1000);
        }

        function stopRecording() {
            if (mediaRecorder) mediaRecorder.stop();
            clearInterval(timerInterval);
            el.recordingUI.classList.add('hidden');
        }

        function cancelRecording() {
            if (mediaRecorder) mediaRecorder.stop();
            clearInterval(timerInterval);
            el.recordingUI.classList.add('hidden');
            audioChunks = [];
        }

        // --- HELPERS ---
        function saveToLocal(chatId, msg) {
            let data = JSON.parse(localStorage.getItem('3m_history') || '{}');
            if (!data[chatId]) data[chatId] = { messages: [] };
            data[chatId].messages.push(msg);
            if (data[chatId].messages.length > 200) data[chatId].messages.shift();
            localStorage.setItem('3m_history', JSON.stringify(data));
        }

        function loadMessages() {
            el.chatMessages.innerHTML = `<div class="flex justify-center my-4"><span class="bg-gray-800 text-[10px] text-gold-500 px-3 py-1 rounded-full border border-gold-500/20">🔒 AES-256 END-TO-END ENCRYPTED</span></div>`;
            const data = JSON.parse(localStorage.getItem('3m_history') || '{}');
            if (data[AppState.activeGroup]) {
                data[AppState.activeGroup].messages.forEach(displayMessage);
            }
        }

        function toggleSidebar() {
            const side = document.getElementById('sidebar');
            side.classList.toggle('-translate-x-full');
            side.classList.toggle('absolute');
        }

        function blobToBase64(blob) {
            return new Promise(res => {
                const reader = new FileReader();
                reader.onloadend = () => res(reader.result);
                reader.readAsDataURL(blob);
            });
        }

        function showNotification(title, body) {
            const toast = document.createElement('div');
            toast.className = 'fixed top-4 right-4 bg-gold-600 text-black p-4 rounded-lg shadow-2xl z-[100] fade-in border-l-4 border-black flex items-center space-x-3';
            toast.innerHTML = `<i class="fa-solid fa-user-plus"></i><div><p class="font-bold text-xs">${title}</p><p class="text-[10px]">${body}</p></div>`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 5000);
        }

        el.msgInput.oninput = () => {
            if (el.msgInput.value.trim()) {
                el.btnMic.classList.add('hidden');
                el.btnSend.classList.remove('hidden');
            } else {
                el.btnMic.classList.remove('hidden');
                el.btnSend.classList.add('hidden');
            }
        };

        // Boot
        window.onload = () => {
            initAuth();
            if (window.innerWidth < 768) {
                document.getElementById('sidebar').classList.add('-translate-x-full');
            }
        };
    </script>
</body>
</html>
